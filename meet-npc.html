<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START BELOW -->
      <!-- MAIN GAME CONTENT -->

    <main class="page">

        <!-- FOREST ENVIRONMENT -->

        <section id="forest" class="meet-npc-grid">

            <h1>Meet the NPC</h1>

            <!-- WORD COLLECTION BOOK BUTTON -->

<a href="word-collection.html" class="book-button">

    <img src="images/book-closed.png" alt="Open Word Collection">

</a>

            <!-- FOREST BACKGROUND -->

            <img class="pathway" src="images/foggy-path.png" alt="A foggy forest pathway">

            <!-- WITCH'S COTTAGE -->

            <img class="cottage" src="images/cottage.svg" alt="A small wooden cottage with a green roof in the forest">

            <!-- PLAYER CHARACTER -->

            <img class="player" src="images/player.svg" alt="Player character wearing a witch hat">

            <!-- NPC CAT CHARACTER -->

            <button type="button" class="npc">
              <img src="images/npc-cat.png" alt="">
              Talk to Cat
            </button>

            <!-- NPC DIALOGUE -->

            <section id="dialogue">

                <h2>Kirbs</h2>

                <p>

                    I was heading to the village,

                    but the path is so ______.

                </p>

            </section>

           <!-- COLLECTIBLE WORD -->

             <button type="button" class="collectible-word" id="collect-foggy">
               Foggy
             </button>

        </section>

    </main>
    
<script src="script.js"></script>
</body>

</html>
