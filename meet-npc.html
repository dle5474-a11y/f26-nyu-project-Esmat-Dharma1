<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START BELOW -->
      <!-- MAIN GAME CONTENT -->

    <main>

        <!-- FOREST ENVIRONMENT -->

        <section id="forest">

            <h1>Meet the NPC</h1>

            <!-- WORD COLLECTION -->

            <button type="button">

                Word Collection

            </button>

            <!-- FOREST BACKGROUND -->

            <img src="images/forest.png" alt="A magical forest with trees and a winding pathway">

            <!-- WITCH'S COTTAGE -->

            <img src="images/cottage.png" alt="A small wooden cottage with a green roof in the forest">

            <!-- PLAYER CHARACTER -->

            <img src="images/player.png" alt="Player character wearing a witch hat">

            <!-- NPC CAT CHARACTER -->

            <button type="button">

                <img src="images/npc-cat.png" alt="">

                Talk to Cat

            </button>

            <!-- NPC DIALOGUE -->

            <section id="dialogue">

                <h2>NPC Dialogue</h2>

                <p>

                    I was heading to the village,

                    but the path is so ______.

                </p>

            </section>

           <!-- COLLECTIBLE WORD -->

             <button type="button" class="collectible-word">
               Foggy
              </button>

        </section>

    </main>

</body>

</html>
