<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START BELOW -->
     <!-- HEADER SECTION -->

    <header>

        <!-- CLOSE WORD COLLECTION -->

        <a href="explore.html">Close Word Collection</a>

        <!-- BOOK ICON -->

        <img src="images/book.png" alt="Word Collection book icon">

    </header>

    <!-- MAIN CONTENT -->

    <main>

        <!-- WORD COLLECTION SECTION -->

        <section id="word-collection">

            <h1>Word Collection</h1>

            <!-- DESCRIPTION -->

            <p>

                Words can be used to help characters

                and restore the area.

            </p>

            <!-- INVENTORY SECTION -->

            <section id="inventory">

                <h2>Inventory</h2>

                <!-- COLLECTED WORDS -->

                <button type="button">Foggy</button>

                <button type="button">Broken</button>

                <button type="button">Dark</button>

                <!-- EMPTY INVENTORY SLOTS -->

                <button type="button" disabled aria-label="Empty inventory slot"></button>

                <button type="button" disabled aria-label="Empty inventory slot"></button>

                <button type="button" disabled aria-label="Empty inventory slot"></button>

            </section>

            <!-- DEFINITION SECTION -->

            <section id="definition">

                <h2>Definition</h2>

                <p>

                    <strong>Foggy:</strong>

                    Weather filled with thick mist,

                    or a mental state of being confused

                    and unable to think clearly.

                </p>

            </section>

        </section>

    </main>

</body>

</html>
