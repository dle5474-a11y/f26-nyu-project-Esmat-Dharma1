<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START BELOW -->
     <!-- MAIN GAME CONTENT -->

    <main>

        <!-- FOREST ENVIRONMENT -->

        <section id="forest">

            <h1>Story Continues</h1>

            <!-- WORD COLLECTION -->

            <a href="word-collection.html">

                Word Collection

            </a>

            <!-- FOREST BACKGROUND -->

            <img src="images/forest.png"

                 alt="A magical forest with trees">

            <!-- FOREST PATHWAY -->

            <img src="images/pathway.png"

                 alt="A winding pathway through the forest">

            <!-- WITCH'S COTTAGE -->

            <img src="images/cottage.png"

                 alt="A small wooden cottage with a green roof">

            <!-- PLAYER CHARACTER -->

            <img src="images/player.png"

                 alt="Player character wearing a witch hat">

            <!-- NPC CAT CHARACTER -->

            <button type="button">

                <img src="images/npc-cat.png" alt="">

                Talk to Cat

            </button>

            <!-- NPC DIALOGUE -->

            <section id="dialogue">

                <h2>NPC Dialogue</h2>

                <!-- DIALOGUE STATE 1: COMPLETED SENTENCE -->

                <p id="dialogue-completed">

                    I was heading to the village,

                    but the path is so foggy!

                </p>

                <!-- DIALOGUE STATE 2: NPC RESPONSE -->

                <p id="dialogue-response" hidden>

                    Thanks for helping me remember!

                    It looks like the path is no longer foggy.

                </p>

            </section>

        </section>

    </main>

</body>

</html>
